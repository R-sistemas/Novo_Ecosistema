name: KDS Android APK
on:
  push:
    paths:
      - 'android/kdsprint/**'
      - '.github/workflows/kds-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build test APK
        working-directory: android/kdsprint
        run: bash gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: r-sistemas-kds-android-debug
          path: android/kdsprint/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
