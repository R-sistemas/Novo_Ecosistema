<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="supabase-key" content="sb_publishable_s0oowaHaCZkMUZgNTo6upw_zljF76Na"><title>Caixa | R Sistemas</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="pdv.mjs"></script>
</head>
<body>
<header><img src="logo.png" alt="R Sistemas"><div><strong>R Sistemas</strong><small>PDV</small></div><span id="status"></span></header>
<main>
<section class="intro"><p class="eyebrow">OPERAÇÃO DE BALCÃO</p><h1>Ponto de venda</h1></section>
<form id="login" class="panel"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button></form><div id="operacao" hidden><label for="empresa">Estabelecimento</label><select id="empresa"></select><div class="layout">
<section class="panel"><h2>Produtos</h2><label for="search">Pesquisar por nome ou código</label><input id="search" type="search" placeholder="Ex.: café ou 101"><div id="products" class="products"></div></section>
<section class="panel"><h2>Venda atual</h2><div id="cart"></div><p class="total"><span>Total</span><strong id="total"></strong></p><form id="sale"><label for="method">Recebimento registrado no caixa</label><select id="method"><option>Dinheiro</option><option>Pix</option><option>Cartão</option></select><button id="finish">Finalizar venda</button></form></section>
<section class="panel cash"><h2>Movimentação de caixa</h2><p id="balance"></p><form id="cash"><label for="amount" id="amount-label"></label><input id="amount" type="number" min="0" step="0.01" required><div id="cash-actions"></div></form><p id="closing"></p></section>
<section class="panel"><h2>Últimos registros</h2><ol id="history"></ol></section>
</div>
<section class="panel">
<h2>Cozinha</h2>
<button id="atualizar-cozinha" type="button">Atualizar pedidos</button>
<p id="aviso-cozinha" role="status"></p>
<div id="fila-cozinha"></div>
</section>
<form id="cadastro-produto" class="panel" hidden>
<h2>Cadastrar produto</h2>
<label for="produto-codigo">Código</label><input id="produto-codigo" maxlength="32" required>
<label for="produto-nome">Nome</label><input id="produto-nome" maxlength="100" required>
<label for="produto-preco">Preço (R$)</label><input id="produto-preco" type="number" min="0.01" step="0.01" required>
<button>Salvar produto</button>
</form>
</div><p id="notice" role="status" aria-live="polite"></p>
</main>
</body></html>
