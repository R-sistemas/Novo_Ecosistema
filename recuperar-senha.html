<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="supabase-key" content="sb_publishable_s0oowaHaCZkMUZgNTo6upw_zljF76Na">
  <title>Recuperar senha | Painel da loja</title>
  <link rel="stylesheet" href="/admin-loja.css">
  <script type="module" src="/admin/interface/recuperar-senha.mjs"></script>
</head>
<body class="acesso-loja">
  <main>
    <h1 id="titulo-area" tabindex="-1">Recuperar senha</h1>
    <section class="cartao" aria-labelledby="titulo-area">
      <p id="status" role="status"></p>
      <form id="solicitar-recuperacao" method="post" hidden>
        <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
        <button type="submit">Enviar link</button>
      </form>
      <form id="definir-nova-senha" method="post" hidden>
        <label>Nova senha (mínimo de 12 caracteres)
          <input name="senha" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        </label>
        <label>Repita a nova senha
          <input name="confirmacao" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
        </label>
        <button type="submit">Definir nova senha</button>
      </form>
      <p><a href="/admin-loja.html">Voltar ao login</a></p>
    </section>
  </main>
</body>
</html>
